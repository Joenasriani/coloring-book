name: Build itch.io ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-itch-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify itch.io entry file
        run: test -f dist/index.html

      - name: Verify music file if present
        run: |
          if [ -d public/music ]; then
            echo "Music folder found. Checking build output."
            test -d dist/music
          else
            echo "No public/music folder found. Building without music asset."
          fi

      - name: Create itch.io ZIP
        run: |
          cd dist
          zip -r ../coloring-book-itch.zip .

      - name: Upload itch.io ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: coloring-book-itch
          path: coloring-book-itch.zip
          if-no-files-found: error
