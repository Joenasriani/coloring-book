<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Coloring Book</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --page-pad: clamp(8px, 2.5vw, 28px);
        --page-gap: clamp(10px, 2.5vw, 28px);
        --header-button-space: clamp(54px, 11vw, 78px);
      }

      * { box-sizing: border-box; }

      html,
      body,
      #root {
        width: 100%;
        min-width: 0;
        min-height: 100%;
        margin: 0;
      }

      html { background-color: #f0f4f8; }

      body {
        padding: 0;
        overflow-x: hidden;
        background-color: #f0f4f8;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      button,
      [role="button"] {
        font: inherit;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      .app-layout {
        display: flex;
        flex-direction: column;
        width: 100%;
        min-width: 0;
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: hidden;
      }

      .app-header {
        width: 100%;
        min-width: 0;
        position: sticky;
        top: 0;
        z-index: 5;
      }

      .header-copy {
        width: 100%;
        max-width: 980px;
        min-width: 0;
      }

      .content-wrapper {
        flex: 1;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        align-items: start;
        width: 100%;
        max-width: 1680px;
        min-width: 0;
        margin: 0 auto;
        padding: var(--page-pad);
        gap: var(--page-gap);
      }

      .drawing-section {
        width: 100%;
        min-width: 0;
        min-height: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .controls-sidebar {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: var(--page-gap);
        width: 100%;
        min-width: 0;
        align-self: start;
      }

      .drawing-container-responsive {
        width: min(100%, 760px, 78dvh);
        max-width: 100%;
        min-width: 0;
        height: auto;
        aspect-ratio: 1 / 1;
      }

      .palette-responsive,
      .nav-responsive {
        width: 100%;
        min-width: 0;
      }

      .nav-responsive > button {
        min-width: 0;
        min-height: 44px;
        white-space: normal;
      }

      @media (max-width: 520px) {
        :root {
          --page-pad: clamp(6px, 2.6vw, 12px);
          --page-gap: clamp(8px, 2.8vw, 12px);
          --header-button-space: clamp(48px, 15vw, 62px);
        }

        .app-header { position: static; }
        .drawing-container-responsive { width: min(100%, 72dvh); }
      }

      @media (max-width: 360px) {
        .drawing-container-responsive { width: min(100%, 68dvh); }
      }

      @media (min-width: 640px) {
        .controls-sidebar {
          grid-template-columns: minmax(0, 1.25fr) minmax(180px, 0.75fr);
          align-items: stretch;
        }
      }

      @media (min-width: 980px) and (min-height: 620px) {
        .content-wrapper {
          grid-template-columns: minmax(420px, 1fr) minmax(300px, 430px);
          align-items: center;
        }

        .controls-sidebar {
          grid-template-columns: minmax(0, 1fr);
          position: sticky;
          top: calc(88px + var(--page-pad));
        }

        .drawing-container-responsive {
          width: min(100%, calc(100dvh - 150px), 900px);
        }
      }

      @media (min-width: 1400px) and (min-height: 760px) {
        .content-wrapper {
          grid-template-columns: minmax(620px, 1fr) 460px;
          gap: clamp(32px, 3.2vw, 56px);
        }

        .drawing-container-responsive {
          width: min(100%, calc(100dvh - 170px), 980px);
        }
      }

      @media (min-width: 760px) and (max-height: 619px) {
        :root {
          --page-pad: clamp(6px, 1.6vw, 14px);
          --page-gap: clamp(8px, 1.8vw, 16px);
        }

        .app-header { position: static; }

        .content-wrapper {
          grid-template-columns: minmax(280px, 1fr) minmax(260px, 380px);
          align-items: center;
        }

        .controls-sidebar {
          grid-template-columns: minmax(0, 1fr);
        }

        .drawing-container-responsive {
          width: min(100%, calc(100dvh - 112px), 640px);
        }
      }

      @media (max-height: 520px) {
        :root {
          --page-pad: 6px;
          --page-gap: 8px;
        }

        .app-header { position: static; }
        .drawing-container-responsive { width: min(100%, 62dvh); }
      }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
</body>
</html>
