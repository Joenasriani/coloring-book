<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Coloring Book</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --page-pad: clamp(6px, 1.8vmin, 14px);
        --page-gap: clamp(6px, 1.6vmin, 12px);
        --header-button-space: clamp(54px, 12vw, 74px);
        --swatch-size: clamp(52px, 8.5vmin, 66px);
        --button-min-height: clamp(48px, 7.2vmin, 58px);
      }

      * { box-sizing: border-box; }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #f0f4f8;
      }

      body {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        overscroll-behavior: none;
      }

      button,
      [role="button"] {
        font: inherit;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        user-select: none;
      }

      .app-layout {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }

      .app-header {
        flex: 0 0 auto;
        width: 100%;
        min-width: 0;
        z-index: 5;
      }

      .header-copy {
        width: 100%;
        max-width: 980px;
        min-width: 0;
      }

      .level-description {
        display: block;
      }

      .content-wrapper {
        flex: 1 1 auto;
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        grid-template-columns: minmax(0, 1fr);
        align-items: stretch;
        width: 100%;
        max-width: 1680px;
        min-width: 0;
        min-height: 0;
        margin: 0 auto;
        padding: var(--page-pad);
        gap: var(--page-gap);
        overflow: hidden;
      }

      .drawing-section {
        width: 100%;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .drawing-container-responsive {
        width: min(100%, 760px);
        height: min(100%, 760px);
        max-width: 100%;
        max-height: 100%;
        min-width: 0;
        min-height: 0;
        aspect-ratio: 1 / 1;
      }

      .controls-sidebar {
        display: grid;
        grid-template-rows: auto auto;
        grid-template-columns: minmax(0, 1fr);
        gap: var(--page-gap);
        width: 100%;
        min-width: 0;
        min-height: 0;
        align-self: end;
        overflow: visible;
      }

      .palette-responsive,
      .nav-responsive {
        width: 100%;
        min-width: 0;
      }

      .palette-responsive > button {
        min-width: var(--swatch-size);
        min-height: var(--swatch-size);
      }

      .nav-responsive > button {
        min-width: 0;
        min-height: var(--button-min-height);
        white-space: normal;
      }

      @media (max-width: 520px) {
        :root {
          --page-pad: 6px;
          --page-gap: 6px;
          --header-button-space: clamp(50px, 15vw, 62px);
          --swatch-size: 46px;
          --button-min-height: 46px;
        }
      }

      @media (max-width: 360px) {
        :root { --swatch-size: 44px; }
      }

      @media (min-width: 700px) {
        .content-wrapper {
          grid-template-rows: minmax(0, 1fr) auto;
        }

        .controls-sidebar {
          grid-template-columns: minmax(0, 1.25fr) minmax(220px, 0.75fr);
          grid-template-rows: auto;
          align-items: stretch;
        }
      }

      @media (min-width: 980px) and (min-height: 620px) {
        :root {
          --swatch-size: clamp(58px, 5.2vw, 72px);
          --button-min-height: 56px;
        }

        .content-wrapper {
          grid-template-columns: minmax(0, 1fr) minmax(320px, 450px);
          grid-template-rows: minmax(0, 1fr);
          align-items: center;
        }

        .controls-sidebar {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: auto auto;
          align-self: center;
        }

        .drawing-container-responsive {
          width: min(100%, calc(100dvh - 118px), 940px);
          height: min(100%, calc(100dvh - 118px), 940px);
        }
      }

      @media (min-width: 1400px) and (min-height: 760px) {
        .content-wrapper {
          grid-template-columns: minmax(0, 1fr) 480px;
          gap: clamp(14px, 2.2vw, 36px);
        }

        .drawing-container-responsive {
          width: min(100%, calc(100dvh - 128px), 1020px);
          height: min(100%, calc(100dvh - 128px), 1020px);
        }
      }

      @media (max-height: 560px) {
        :root {
          --page-pad: 5px;
          --page-gap: 5px;
          --button-min-height: 42px;
        }

        .level-description { display: none; }
      }

      @media (max-height: 470px) {
        :root { --swatch-size: 42px; }
      }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
</body>
</html>
