<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coloring Book</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
      html, body {
        min-height: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        background-color: #f0f4f8;
      }
      
      #root {
        min-height: 100%;
      }

      .app-layout {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        width: 100%;
        box-sizing: border-box;
      }

      .app-header {
        width: 100%;
        box-sizing: border-box;
      }

      .content-wrapper {
        display: flex;
        flex-direction: column;
        flex-grow: 1;
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        gap: 20px;
      }

      .drawing-section {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .controls-sidebar {
        display: flex;
        flex-direction: column;
        gap: 20px;
        width: 100%;
      }

      .drawing-container-responsive {
        width: 100%;
        max-width: 100%;
        height: auto;
        aspect-ratio: 1 / 1;
      }

      @media (min-width: 481px) {
        .content-wrapper {
          padding: 30px;
          max-width: 800px;
          margin: 0 auto;
        }

        .controls-sidebar {
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
        }

        .palette-responsive {
            flex: 1 1 300px;
        }
        
        .nav-responsive {
            flex: 1 1 200px;
        }
      }

      @media (min-width: 1440px) {
        .app-layout {
            padding: 40px;
        }

        .content-wrapper {
            max-width: 1800px;
            margin: 0 auto;
            flex-direction: row;
            align-items: flex-start;
            gap: 60px;
            min-height: calc(100vh - 120px);
        }

        .drawing-section {
            flex: 2;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .drawing-container-responsive {
            width: min(100%, 820px);
            max-width: 100%;
        }

        .controls-sidebar {
            flex: 1;
            flex-direction: column;
            justify-content: center;
            gap: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 30px;
            backdrop-filter: blur(10px);
        }
        
        .nav-responsive {
            margin-top: auto;
        }
      }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
